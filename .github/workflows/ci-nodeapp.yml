name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  id-token: write   # REQUIRED for OIDC
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/node-web-app:latest \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/node-web-app:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/node-web-app:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/node-web-app:${{ github.sha }}
