name: Provision AKS Terraform

# Manual trigger with environment, region, and resource group input
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, staging, prod)'
        required: true
        default: 'dev'
      region:
        description: 'Azure region (e.g., eastus, westus2)'
        required: true
        default: 'eastus'


permissions:
  id-token: write   # For Azure OIDC login
  contents: read

jobs:
  terraform:
    name: Terraform AKS
    runs-on: ubuntu-latest
    environment: dev

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      REGION: ${{ github.event.inputs.region }}

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      # Azure login via OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Initialize Terraform
      - name: Terraform Init
        working-directory: infra/$ENVIRONMENT/$REGION/aks
        run: terraform init 

      # Terraform Plan
      - name: Terraform Plan
        working-directory: infra/$ENVIRONMENT/$REGION/aks
        run: terraform plan -out=tfplan 

      # Terraform Apply
      - name: Terraform Apply
        if: github.event.inputs.environment != ''
        working-directory: infra/$ENVIRONMENT/$REGION/aks
        run: terraform apply -auto-approve tfplan
